<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny Weather</title>
  <style>
    body { font: 18px system-ui; max-width: 420px; margin: 80px auto; padding: 24px; }
    input, button { box-sizing: border-box; width: 100%; padding: 12px; margin-top: 12px; font: inherit; }
    button { cursor: pointer; }
    #result { min-height: 3em; }
  </style>
  <h1>Tiny Weather</h1>
  <p>Check the weather in San Francisco.</p>
  <form id="form">
    <label for="key">OpenWeather API key</label>
    <input id="key" type="password" autocomplete="off" required placeholder="Paste your API key">
    <button id="button">Get weather</button>
  </form>
  <p id="result" role="status" aria-live="polite">Add a key to get started.</p>
  <p><small>Your key is sent directly to OpenWeather and is not saved. This frontend demo does not hide the key from browser developer tools.</small></p>
  <a href="https://home.openweathermap.org/api_keys" target="_blank" rel="noreferrer">Get an OpenWeather key</a>
  <script>
    const form = document.querySelector('#form');
    const key = document.querySelector('#key');
    const button = document.querySelector('#button');
    const result = document.querySelector('#result');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!key.value.trim()) {
        result.textContent = 'Enter an API key first.';
        return;
      }
      button.disabled = true;
      result.textContent = 'Loading…';
      try {
        const url = new URL('https://api.openweathermap.org/data/2.5/weather');
        url.search = new URLSearchParams({
          lat: '37.7749', lon: '-122.4194', units: 'metric', appid: key.value.trim()
        });
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(response.status === 401
            ? 'API key rejected. Check your key or wait for a new key to activate.'
            : 'Could not load weather. Try again later.');
        }
        const data = await response.json();
        result.textContent = `${Math.round(data.main.temp)}°C — ${data.weather[0].description}`;
      } catch (error) {
        result.textContent = error instanceof TypeError
          ? 'Could not reach OpenWeather. Check your connection.'
          : error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</html>
