<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny Weather</title>
  <style>
    body { font: 18px system-ui; max-width: 420px; margin: 80px auto; padding: 24px; }
    button { box-sizing: border-box; width: 100%; padding: 12px; margin-top: 12px; font: inherit; }
    button { cursor: pointer; }
    #result { min-height: 3em; }
  </style>
  <h1>Tiny Weather</h1>
  <p>Check the weather in San Francisco.</p>
  <form id="form">
    <button id="button">Get weather</button>
  </form>
  <p id="result" role="status" aria-live="polite"></p>
  <p><small>This demo requires VITE_OPENWEATHER_API_KEY in the sandbox environment. Frontend environment variables are visible in the browser.</small></p>
  <a href="https://home.openweathermap.org/api_keys" target="_blank" rel="noreferrer">Get an OpenWeather key</a>
  <script type="module">
    const form = document.querySelector('#form');
    const apiKey = import.meta.env.VITE_OPENWEATHER_API_KEY?.trim();
    const button = document.querySelector('#button');
    const result = document.querySelector('#result');
    const missingKeyMessage = 'Missing VITE_OPENWEATHER_API_KEY. Set it in the sandbox environment and restart the dev server.';
    result.textContent = apiKey ? 'Ready to get weather.' : missingKeyMessage;
    button.disabled = !apiKey;

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!apiKey) {
        result.textContent = missingKeyMessage;
        return;
      }
      button.disabled = true;
      result.textContent = 'Loading…';
      try {
        const url = new URL('https://api.openweathermap.org/data/2.5/weather');
        url.search = new URLSearchParams({
          lat: '37.7749', lon: '-122.4194', units: 'metric', appid: apiKey
        });
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(response.status === 401
            ? 'API key rejected. Check your key or wait for a new key to activate.'
            : 'Could not load weather. Try again later.');
        }
        const data = await response.json();
        result.textContent = `${Math.round(data.main.temp)}°C — ${data.weather[0].description}`;
      } catch (error) {
        result.textContent = error instanceof TypeError
          ? 'Could not reach OpenWeather. Check your connection.'
          : error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</html>
